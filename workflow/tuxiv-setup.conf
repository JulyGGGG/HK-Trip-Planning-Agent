entrypoint:
  - bash ${TACC_WORKDIR}/setup_env.sh
environment:
  name: mpi-gemm-v1
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: storm-env-setup
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=2
    - time=00:45:00
    - output=${TACC_SLURM_USERLOG}/storm-env-setup-%j.log
